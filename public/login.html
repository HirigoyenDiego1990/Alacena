<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALACENA — Ingresar</title>
    <link rel="stylesheet" href="./estilos.css">
    <!-- Fuentes del sistema de diseño -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="shurtcut icon" href="./img/alacena_icon_192x192.png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Enlace al Manifest -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f97316">
</head>
<body>

    <!-- App Shell Principal -->
    <div id="app">
        
        <!-- VISTA: AUTENTICACIÓN -->
        <div id="auth-view" class="view active">
            <div class="auth-wrap">
                <div class="auth-hero">
                    <div class="brand-mark-lg">
    <img 
        src="./img/alacena_icon_512x512.png" 
        alt="Alacena" 
        width="80" 
        height="80"
        style="
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        "
    >
</div>
                    <h1>Alacena</h1>
                    <p>Aprovechá al máximo lo que tenés en casa y zafa esa comida.</p>
                </div>

                <!-- Contenedor de errores por si fallan las credenciales -->
                <div id="auth-error" class="auth-error"></div>

                <form id="auth-form">
                    <div class="field">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" placeholder="tucorreo@email.com" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                    <button type="submit" id="auth-submit-btn" class="btn btn-primary" style="margin-top: 6px;">
                        <span>Ingresar</span>
                    </button>
                </form>

                <!-- <div class="auth-switch">
                    <span id="auth-switch-text">¿No tenés cuenta?</span> 
                    <button type="button" id="auth-switch-btn">Registrate</button>
                </div> -->
            </div>
        </div>

    </div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log("Service Worker registrado con éxito"))
            .catch((err) => console.log("Error al registrar Service Worker", err));
        });
      }
    </script>

    <!-- Script principal de tu aplicación (Módulo) -->
    <script type="module" src="./login.js"></script>
</body>
</html>
